name: Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t kiro-rs:local .

      - name: Save image
        run: docker save kiro-rs:local | gzip > kiro-rs.tar.gz

      - name: Upload image and compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          source: kiro-rs.tar.gz,docker-compose.deploy.yml
          target: /home/ubuntu/kiro-deploy
          overwrite: true

      - name: Load image and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          password: ${{ secrets.DEPLOY_PASSWORD }}
          port: 22
          script: |
            set -euo pipefail
            mkdir -p /home/ubuntu/kiro.rs/config
            gunzip -c /home/ubuntu/kiro-deploy/kiro-rs.tar.gz | sudo docker load
            cp /home/ubuntu/kiro-deploy/docker-compose.deploy.yml /home/ubuntu/kiro.rs/docker-compose.deploy.yml
            cd /home/ubuntu/kiro.rs
            sudo docker compose -f docker-compose.deploy.yml up -d --force-recreate
            sudo docker ps --filter name=kiro-rs
            rm -f /home/ubuntu/kiro-deploy/kiro-rs.tar.gz
